# .github/workflows/hello-world.yml
name: Hello World Demo

# 1️⃣ When should this run?  On any push to the main branch
on:
  push:
    branches: [ main ]

jobs:
  # 2️⃣ A single job called “demo”
  demo:
    runs-on: ubuntu-latest   # 3️⃣ Use a free GitHub‑hosted Ubuntu VM

    steps:
      # 4️⃣ Checkout the repository so the runner sees your code
      - name: Checkout source
        uses: actions/checkout@v4

      # 5️⃣ Install Python 3.11 (any version works for this demo)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 6️⃣ Install a tiny library – just to show “pip install”
      - name: Install dependencies
        run: pip install requests

      # 7️⃣ Run the demo script
      - name: Run hello‑world script
        run: |
          python <<'PY'
          import requests, os, json
          repo = os.getenv('GITHUB_REPOSITORY')
          # Hit the GitHub API just to prove we can talk to it
          r = requests.get(f'https://api.github.com/repos/{repo}')
          data = r.json()
          print(f"🤖 Hello from {data['full_name']}!")
          PY
