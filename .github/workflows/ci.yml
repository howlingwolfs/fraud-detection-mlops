name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Pytest
      run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t $LOGIN_SERVER/fraud-api:${{ github.sha }} .
        docker build -t $LOGIN_SERVER/fraud-api:latest .
        docker push $LOGIN_SERVER/fraud-api:${{ github.sha }}
        docker push $LOGIN_SERVER/fraud-api:latest
