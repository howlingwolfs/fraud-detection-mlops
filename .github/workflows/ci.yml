    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/fraud-api:${{ github.sha }} .
        docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/fraud-api:latest .
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/fraud-api:${{ github.sha }}
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/fraud-api:latest

    - name: Azure Login
      uses: azure/login@v2
